<script>
const pages = [
{t:"Sambutan dari Hutan",p:`Di sebuah desa kecil bernama Arunika, hiduplah seorang anak laki-laki bernama Elvan. Desa itu dikelilingi pegunungan hijau, sungai jernih, dan hutan luas yang konon menyimpan banyak rahasia.

Elvan dikenal sebagai anak yang pendiam, tetapi memiliki rasa ingin tahu yang sangat besar. Ia sering menghabiskan waktunya membaca buku-buku tua milik kakeknya.

Suatu malam, ketika sedang duduk di dekat jendela, Elvan melihat cahaya biru berkilauan dari arah hutan.

Cahaya itu bergerak seperti sedang memanggilnya.`,s:"Desa kecil yang indah pada malam hari, rumah kayu bercahaya hangat, hutan biru di kejauhan.",m:"village"},
{t:"Buku Tua Kakek",p:`Keesokan paginya, Elvan mencari tahu tentang cahaya misterius tersebut.

Ia membuka sebuah lemari tua di kamar kakeknya. Di dalamnya terdapat sebuah buku bersampul hitam dengan lambang pohon berwarna emas.

Ketika dibuka, sebuah kalimat tertulis di halaman pertama:

“Ketika cahaya terakhir menghilang, seseorang dengan hati yang berani akan menemukan jalan menuju sumber kehidupan.”

Elvan terdiam.

Di halaman berikutnya terdapat gambar sebuah hutan dengan pohon raksasa di tengahnya.

Di bawah gambar itu tertulis nama: Hutan Cahaya.`,s:"Buku kuno terbuka di atas meja kayu, cahaya keemasan dan simbol pohon misterius.",m:"book"},
{t:"Peta yang Tersembunyi",p:`Saat membalik halaman buku, Elvan menemukan sebuah kertas kecil yang tersembunyi di balik sampul.

Kertas itu ternyata sebuah peta.

Garis-garisnya menunjukkan jalan dari desa Arunika menuju sebuah tempat bernama Lembah Kabut.

Di bagian bawah peta terdapat tulisan:

“Jangan mencari kekuatan untuk dirimu sendiri. Carilah alasan untuk menyelamatkan yang lain.”

Elvan mulai merasa bahwa buku itu bukan sekadar peninggalan biasa.

Ia memutuskan untuk mencari tahu rahasia di baliknya.`,s:"Peta kuno dengan pegunungan, sungai, hutan, dan tanda X keemasan.",m:"map"},
{t:"Pertemuan dengan Nara",p:`Sebelum memulai perjalanan, Elvan mengunjungi sahabatnya, Nara.

Nara adalah seorang gadis pemberani yang sangat menyukai alam dan petualangan.

“Elvan, kau benar-benar ingin pergi ke hutan itu?” tanyanya.

“Aku hanya ingin mengetahui apa yang sebenarnya terjadi,” jawab Elvan.

Nara tersenyum.

“Kalau begitu, aku ikut. Petualangan akan lebih menarik jika dilakukan bersama.”

Elvan mengangguk.

Mereka pun mulai menyiapkan perlengkapan perjalanan.`,s:"Elvan dan Nara berdiri di tepi desa membawa tas petualangan, pegunungan hijau.",m:"friends"},
{t:"Awal Perjalanan",p:`Pagi-pagi sekali, Elvan dan Nara meninggalkan desa.

Mereka membawa bekal makanan, botol air, kompas, dan buku tua milik kakek Elvan.

Perjalanan dimulai melalui jalan setapak yang dipenuhi bunga liar.

Burung-burung berkicau di antara pepohonan.

Namun, semakin jauh mereka berjalan, suasana semakin sunyi.

Tidak ada suara manusia. Bahkan angin pun terasa berhenti.

Nara mulai merasa ada sesuatu yang aneh.`,s:"Dua sahabat berjalan di jalan setapak, sinar matahari menembus dedaunan.",m:"path"},
{t:"Gerbang Hutan Cahaya",p:`Setelah berjalan berjam-jam, mereka menemukan dua pohon besar yang tumbuh saling berhadapan.

Di antara kedua pohon itu terdapat gerbang batu tua.

Pada gerbang tersebut terukir tulisan:

“Hanya mereka yang jujur terhadap dirinya sendiri yang dapat melangkah masuk.”

Elvan mendekati gerbang.

Tiba-tiba, batu-batu itu bergetar dan cahaya hijau muncul dari ukirannya.

Gerbang perlahan terbuka.

Mereka akhirnya memasuki Hutan Cahaya.`,s:"Gerbang batu kuno di antara dua pohon raksasa, cahaya hijau dan kunang-kunang.",m:"gate"},
{t:"Sungai yang Berbicara",p:`Di dalam hutan, mereka menemukan sungai dengan air berwarna kebiruan.

Anehnya, suara sungai terdengar seperti bisikan.

“Jika ingin menemukan pohon kehidupan, jawablah pertanyaanku.”

Elvan dan Nara saling berpandangan.

Sungai bertanya, “Apakah sesuatu yang semakin dibagikan justru semakin bertambah?”

Nara berpikir cukup lama.

“Kebahagiaan?” jawabnya.

Air sungai berkilauan.

“Jawaban yang benar.”

Sebuah jembatan cahaya muncul di atas sungai.`,s:"Sungai ajaib biru bercahaya dengan jembatan transparan dan pepohonan.",m:"river"},
{t:"Burung Emas",p:`Setelah melewati sungai, mereka mendengar suara kepakan sayap.

Seekor burung kecil berwarna emas terjatuh di dekat akar pohon.

Sayapnya tampak terluka.

Nara segera menghampirinya.

“Kita harus menolongnya,” katanya.

Elvan mengambil kain bersih dari tasnya dan membantu membalut sayap burung itu.

Beberapa saat kemudian, burung tersebut kembali berdiri.

Ia memandang mereka dan berkata, “Namaku Luma. Terima kasih telah menolongku.”

Elvan terkejut karena burung itu bisa berbicara.`,s:"Burung kecil berbulu emas dengan sayap bercahaya berada dekat tangan seorang anak.",m:"bird"},
{t:"Pelindung Hutan",p:`Luma ternyata bukan burung biasa.

Ia adalah penjaga kecil Hutan Cahaya.

Luma menjelaskan bahwa hutan tersebut sedang kehilangan kekuatannya.

Pohon-pohon mulai mengering, sungai kehilangan warna, dan cahaya yang dahulu memenuhi hutan semakin redup.

“Semua ini terjadi karena Kristal Kehidupan telah menghilang,” jelas Luma.

“Di mana kristal itu?” tanya Elvan.

“Di Menara Bayangan, jauh di balik Lembah Kabut.”

Elvan dan Nara menyadari bahwa perjalanan mereka baru saja dimulai.`,s:"Burung emas terbang di atas hutan yang sebagian bercahaya dan sebagian mulai gelap.",m:"forest"},
{t:"Lembah Kabut",p:`Mereka melanjutkan perjalanan menuju Lembah Kabut.

Tempat itu dipenuhi kabut putih yang sangat tebal.

Jalan setapak hampir tidak terlihat.

Nara menggenggam peta dengan erat, sementara Elvan menggunakan kompas.

Tiba-tiba, terdengar suara langkah kaki dari balik kabut.

“Siapa di sana?” seru Elvan.

Tidak ada jawaban.

Namun, sebuah bayangan besar mulai terlihat mendekati mereka.`,s:"Lembah berkabut dengan pepohonan tinggi dan siluet besar di kejauhan.",m:"mist"},
{t:"Penjaga Batu",p:`Dari balik kabut muncul makhluk besar berbentuk manusia yang seluruh tubuhnya terbuat dari batu.

Namanya adalah Garon, penjaga Lembah Kabut.

“Siapa yang berani melewati wilayahku?” tanyanya dengan suara berat.

Elvan menjelaskan tujuan perjalanan mereka.

Garon terdiam.

“Jika ingin melewati lembah ini, kalian harus membuktikan bahwa kalian mampu bekerja sama.”

Ia menunjuk tiga batu besar yang terletak berjauhan.

“Kumpulkan ketiganya sebelum matahari terbenam.”`,s:"Raksasa batu bermata hijau berdiri di depan dua anak kecil di lembah berkabut.",m:"guardian"},
{t:"Ujian Kerja Sama",p:`Elvan mencoba mengangkat batu pertama, tetapi terlalu berat.

Nara menemukan sebuah batang kayu yang dapat digunakan sebagai pengungkit.

Mereka bekerja sama dan berhasil memindahkan batu pertama.

Untuk batu kedua, mereka harus menyusun beberapa batu kecil agar dapat mencapai tempat yang lebih tinggi.

Sementara itu, Luma membantu menemukan batu ketiga dari udara.

Akhirnya, ketiga batu berhasil dikumpulkan.

Garon tersenyum.

“Kekuatan terbesar bukanlah kekuatan seseorang, melainkan kemampuan untuk saling membantu.”`,s:"Elvan dan Nara bekerja sama memindahkan batu, Luma terbang membantu dari atas.",m:"team"},
{t:"Hadiah dari Garon",p:`Sebagai hadiah, Garon memberikan sebuah lentera kecil kepada Elvan.

Lentera itu memiliki api berwarna biru.

“Gunakan lentera ini ketika kalian kehilangan arah,” katanya.

Elvan mengucapkan terima kasih.

Sebelum pergi, Garon memberikan sebuah peringatan.

“Di balik gunung terdapat tempat yang mampu menunjukkan ketakutan terbesar seseorang. Jangan biarkan ketakutan menguasai hati kalian.”

Ketiganya kembali melanjutkan perjalanan.`,s:"Raksasa batu menyerahkan lentera biru bercahaya kepada seorang anak.",m:"lantern"},
{t:"Gunung Cermin",p:`Mereka tiba di sebuah gunung yang permukaannya berkilau seperti kaca.

Setiap orang yang mendekatinya akan melihat bayangan dirinya sendiri.

Namun, bayangan tersebut menunjukkan sesuatu yang berbeda.

Elvan melihat dirinya berdiri sendirian di tengah dunia yang gelap.

Nara melihat dirinya kehilangan semua sahabatnya.

Mereka mulai merasa takut.

“Jangan percaya pada semua yang kalian lihat,” kata Luma.`,s:"Gunung kristal seperti cermin memantulkan bayangan berbeda dari dua anak.",m:"mirror"},
{t:"Ketakutan Elvan",p:`Elvan terus memandang bayangan dirinya.

Dalam bayangan itu, ia melihat dirinya gagal menyelamatkan hutan.

Semua orang menyalahkannya.

Ia mulai meragukan kemampuannya sendiri.

“Aku tidak yakin bisa melakukan ini,” katanya pelan.

Nara menghampirinya.

“Kau tidak harus menjadi orang paling kuat, Elvan. Yang penting adalah kau tidak berhenti mencoba.”

Kata-kata itu membuat Elvan kembali bersemangat.

Ia mengangkat lentera biru dan berjalan maju.`,s:"Elvan di depan cermin besar, cahaya biru menerangi langkahnya.",m:"brave"},
{t:"Pintu ke Menara Bayangan",p:`Setelah melewati gunung, mereka menemukan sebuah pintu hitam yang sangat besar.

Pintu itu berdiri di tengah dataran tandus.

Di atasnya terdapat lambang matahari yang tertutup awan.

Luma menjelaskan bahwa pintu tersebut merupakan jalan menuju Menara Bayangan.

Namun, pintu itu tidak memiliki gagang ataupun lubang kunci.

Elvan mengamati ukiran pada permukaannya.

Ia menemukan tiga simbol: hati, bintang, dan pohon.`,s:"Pintu raksasa hitam dengan tiga simbol bercahaya di tengah dataran misterius.",m:"door"},
{t:"Tiga Simbol",p:`Elvan mencoba menyentuh simbol hati.

Tidak terjadi apa-apa.

Nara kemudian menyentuh simbol pohon.

Permukaan pintu sedikit bergetar.

Luma terbang menuju simbol bintang dan menyentuhnya dengan paruhnya.

Ketiga simbol mulai bersinar.

Terdengar suara dari balik pintu.

“Keberanian, kebijaksanaan, dan kepedulian adalah tiga kunci menuju harapan.”

Pintu perlahan terbuka.`,s:"Tiga simbol emas menyala pada pintu batu hitam dengan cahaya menyebar.",m:"symbols"},
{t:"Menara Bayangan",p:`Di balik pintu terdapat sebuah menara tinggi yang hampir menyentuh awan.

Langit di sekitarnya berwarna kelabu.

Tidak ada tumbuhan ataupun suara burung.

Mereka memasuki menara dengan hati-hati.

Di dalamnya terdapat tangga melingkar yang sangat panjang.

Pada dinding terdapat lukisan-lukisan kuno yang menggambarkan sebuah kerajaan bercahaya.

Luma menjelaskan bahwa dahulu tempat itu merupakan pusat kekuatan seluruh hutan.`,s:"Menara batu raksasa dengan tangga spiral, jendela tinggi, suasana misterius.",m:"tower"},
{t:"Sosok Bertudung Hitam",p:`Ketika mereka mencapai lantai tertinggi, muncul seseorang berjubah hitam.

Wajahnya tidak terlihat jelas.

Di tangannya terdapat sebuah kristal berwarna biru yang memancarkan cahaya redup.

“Itukah Kristal Kehidupan?” tanya Elvan.

Sosok itu mengangguk.

“Kristal ini tidak akan pernah kembali ke tangan kalian.”

Nara bertanya, “Mengapa kau mengambilnya?”

Sosok tersebut terdiam cukup lama.

“Aku hanya tidak ingin kehilangan cahaya yang pernah kumiliki.”`,s:"Sosok misterius berjubah hitam memegang kristal biru di ruangan menara gelap.",m:"hood"},
{t:"Rahasia Sang Penjaga",p:`Sosok itu akhirnya memperkenalkan dirinya sebagai Arel.

Dahulu, ia adalah penjaga utama Hutan Cahaya.

Namun, ketika kekuatannya mulai berkurang, ia merasa dilupakan oleh semua penghuni hutan.

Ia mengambil Kristal Kehidupan karena mengira kristal tersebut dapat mengembalikan kekuatannya.

Namun, tindakannya justru membuat seluruh hutan kehilangan kehidupan.

“Aku hanya ingin dianggap penting,” ucap Arel.

Elvan mulai memahami bahwa Arel bukanlah sosok yang sepenuhnya jahat.`,s:"Arel duduk sendirian di menara, memandang kristal biru dengan ekspresi sedih.",m:"arel"},
{t:"Pertengkaran",p:`Nara merasa marah.

“Karena keinginanmu sendiri, seluruh hutan menjadi rusak!” katanya.

Arel menundukkan kepala.

“Aku tahu. Tetapi aku tidak tahu bagaimana memperbaikinya.”

Elvan mendekati Arel.

“Kalau begitu, kembalikan kristalnya. Kita masih bisa memperbaiki semuanya.”

Arel menggeleng.

“Aku takut mereka tidak akan pernah memaafkanku.”

Elvan menjawab, “Memperbaiki kesalahan memang tidak selalu mudah. Tetapi itu lebih baik daripada terus bersembunyi.”`,s:"Elvan berbicara kepada Arel di ruangan tinggi, cahaya kristal menyinari mereka.",m:"talk"},
{t:"Kristal Kehidupan",p:`Arel akhirnya menyerahkan Kristal Kehidupan kepada Elvan.

Ketika Elvan menyentuhnya, kristal itu memancarkan cahaya yang sangat terang.

Seluruh ruangan bergetar.

Namun, tiba-tiba muncul retakan pada kristal.

Luma terkejut.

“Kristal ini sudah terlalu lama terpisah dari sumber kehidupannya!”

Mereka harus segera membawanya ke Pohon Cahaya sebelum kristal itu kehilangan seluruh kekuatannya.`,s:"Kristal biru bercahaya di tangan Elvan dengan sinar emas dan retakan kecil.",m:"crystal"},
{t:"Jalan Pulang",p:`Mereka bergegas meninggalkan menara.

Arel memutuskan untuk ikut membantu.

Namun, perjalanan kembali ternyata lebih sulit.

Kabut semakin tebal dan jalan yang sebelumnya mereka lewati mulai menghilang.

Lentera pemberian Garon kembali menyala.

Cahaya birunya menunjukkan jalan menuju hutan.

Mereka mengikuti cahaya tersebut tanpa berhenti.`,s:"Empat sahabat berjalan melalui kabut tebal dengan lentera biru menerangi jalan.",m:"return"},
{t:"Pohon Cahaya",p:`Setelah perjalanan panjang, mereka akhirnya sampai di tengah Hutan Cahaya.

Di sana berdiri sebuah pohon raksasa dengan batang berwarna putih keemasan.

Namun, daun-daunnya hampir seluruhnya gugur.

Itulah Pohon Cahaya, sumber kehidupan seluruh hutan.

Elvan mendekati batang pohon dan mengangkat Kristal Kehidupan.

Namun, kristal itu tidak bereaksi.

Luma mulai merasa khawatir.`,s:"Pohon raksasa berbatang putih keemasan, akar besar, dedaunan mulai mengering.",m:"tree"},
{t:"Ujian Terakhir",p:`Tiba-tiba terdengar suara dari dalam pohon.

“Kristal tidak dapat menghidupkan sesuatu tanpa ketulusan hati.”

Elvan bertanya, “Apa yang harus kami lakukan?”

Suara itu menjawab:

“Temukan cahaya yang ada di dalam diri kalian.”

Elvan memejamkan mata.

Ia teringat perjalanan panjang, bantuan Nara, keberanian Luma, dan perubahan hati Arel.

Ia akhirnya memahami bahwa kekuatan bukan berasal dari kristal semata.

Kekuatan itu juga berasal dari kepedulian.`,s:"Elvan berdiri di depan pohon raksasa dengan mata terpejam, cahaya lembut menyelimutinya.",m:"inner"},
{t:"Kekuatan Persahabatan",p:`Nara berdiri di samping Elvan.

Ia meletakkan tangannya pada kristal.

Luma ikut menyentuhnya dengan sayap kecilnya.

Arel pun mendekat dan mengakui kesalahannya dengan tulus.

Keempatnya menyatukan harapan mereka.

Kristal mulai bersinar.

Cahaya biru berubah menjadi emas.

Akar pohon bergerak perlahan dan daun-daun baru mulai tumbuh.`,s:"Empat tokoh mengelilingi kristal bercahaya, sinar emas menyebar ke pohon.",m:"unity"},
{t:"Hutan Kembali Hidup",p:`Cahaya keemasan menyebar ke seluruh hutan.

Sungai kembali jernih.

Bunga-bunga bermekaran.

Burung-burung kembali bernyanyi di atas pepohonan.

Langit yang sebelumnya gelap berubah menjadi biru cerah.

Semua makhluk hutan keluar dari persembunyian mereka.

Hutan Cahaya akhirnya kembali seperti dahulu.

Nara tersenyum bahagia.

“Kita berhasil!”`,s:"Hutan fantasi kembali hijau, bunga warna-warni, sungai jernih, cahaya matahari.",m:"bloom"},
{t:"Maaf dari Arel",p:`Arel berdiri di hadapan para penghuni hutan.

Ia mengakui semua kesalahannya.

“Aku telah mengambil sesuatu yang bukan milikku. Aku membuat kalian menderita karena keegoisanku.”

Ia menundukkan kepala.

Para penghuni hutan awalnya terdiam.

Kemudian, seekor rusa tua mendekatinya.

“Kesalahan tidak dapat mengubah masa lalu, tetapi tindakan baik dapat membangun masa depan.”

Arel akhirnya diberi kesempatan untuk memperbaiki hutan.`,s:"Arel meminta maaf kepada hewan-hewan hutan di bawah pohon bercahaya.",m:"apology"},
{t:"Perayaan Cahaya",p:`Sebagai bentuk rasa syukur, seluruh penghuni hutan mengadakan perayaan.

Kunang-kunang menerangi langit malam.

Bunga-bunga bercahaya bermekaran di sepanjang sungai.

Garon datang dari Lembah Kabut membawa hadiah berupa batu kristal kecil.

Ia menyerahkannya kepada Elvan dan Nara.

“Kenanglah perjalanan ini. Kalian telah membuktikan bahwa keberanian dapat mengubah banyak hal.”`,s:"Perayaan malam dengan kunang-kunang, lentera, bunga bercahaya, dan hewan hutan.",m:"festival"},
{t:"Hadiah dari Pohon Cahaya",p:`Pohon Cahaya memberikan sebuah hadiah kepada Elvan.

Sebuah biji kecil berwarna emas.

“Tanamlah biji ini di tempat yang membutuhkan harapan,” bisik suara pohon.

Elvan menerima biji tersebut dengan hati-hati.

Nara juga mendapatkan sebuah kalung berbentuk daun.

Luma memberikan sebuah bulu emas kepada keduanya sebagai tanda persahabatan.`,s:"Pohon raksasa memberikan biji emas bercahaya kepada Elvan, Nara dan Luma di sampingnya.",m:"gift"},
{t:"Perpisahan",p:`Waktunya tiba bagi Elvan dan Nara untuk kembali ke desa.

Luma mengantar mereka sampai gerbang hutan.

“Aku akan selalu mengingat kalian,” kata Luma.

Elvan tersenyum.

“Kami juga tidak akan melupakanmu.”

Luma mengepakkan sayapnya.

Burung kecil itu terbang mengelilingi mereka sebelum kembali menuju Pohon Cahaya.

Perjalanan panjang itu akhirnya sampai pada penghujungnya.`,s:"Dua sahabat melambaikan tangan kepada burung emas di depan gerbang hutan.",m:"farewell"},
{t:"Kembali ke Arunika",p:`Setelah melewati jalan panjang, Elvan dan Nara akhirnya tiba di desa Arunika.

Penduduk desa menyambut mereka dengan gembira.

Kakek Elvan terlihat berdiri di depan rumah.

“Kau akhirnya menemukan jawabannya,” katanya sambil tersenyum.

Elvan terkejut.

“Jadi, Kakek sudah mengetahui semuanya?”

Kakeknya tertawa kecil.

“Beberapa rahasia memang harus ditemukan melalui perjalanan.”`,s:"Desa Arunika pada pagi hari, penduduk menyambut dua anak yang baru pulang.",m:"home"},
{t:"Biji Harapan",p:`Beberapa hari kemudian, Elvan menanam biji emas pemberian Pohon Cahaya di halaman rumahnya.

Ia menyiramnya setiap pagi.

Hari demi hari berlalu.

Suatu pagi, sebuah tunas kecil tumbuh dari tanah.

Daunnya berwarna hijau keemasan.

Elvan memanggil Nara untuk melihatnya.

Mereka menyadari bahwa meskipun perjalanan telah selesai, harapan baru saja dimulai.`,s:"Tunas hijau keemasan tumbuh di halaman rumah dalam sinar matahari pagi.",m:"sprout"},
{t:"Cahaya yang Tidak Pernah Padam",p:`Bertahun-tahun kemudian, pohon kecil itu tumbuh menjadi pohon yang indah.

Desa Arunika menjadi semakin hijau dan damai.

Elvan tidak pernah melupakan petualangannya bersama Nara, Luma, dan Arel.

Ia akhirnya memahami satu hal penting:

Keberanian bukan berarti tidak memiliki rasa takut. Keberanian adalah tetap melangkah meskipun kita merasa takut.

Persahabatan bukan hanya tentang selalu bersama, tetapi juga tentang saling membantu ketika keadaan menjadi sulit.

Dan harapan tidak pernah benar-benar hilang selama masih ada seseorang yang bersedia menjaganya.

Di bawah langit senja, daun-daun pohon itu berkilauan.

Seolah-olah Hutan Cahaya sedang mengirimkan salam dari kejauhan.`,s:"Pohon besar berdaun keemasan di bawah langit senja, siluet dua sahabat dan cahaya lembut.",m:"ending"}

}

add(makePage("Sambutan Pembaca",`Selamat datang di Arunika, sebuah desa kecil di tepi dunia yang menyimpan rahasia. Ikutilah Elvan, Nara, dan teman-teman baru mereka menembus hutan ajaib, menghadapi teka-teki, dan menemukan arti keberanian yang sesungguhnya.\n\nBacalah perlahan, nikmati setiap halaman, dan biarkan cahaya cerita ini mengingatkan kita bahwa harapan dapat tumbuh dari tindakan sederhana.`,coverSvg(),""));
let toc=document.createElement("section");toc.className="page frontmatter";toc.innerHTML=`<div class="page-inner"><div class="page-head"><span>Petunjuk perjalanan</span><span>Isi buku</span></div><h2>Daftar Isi</h2><div class="toc" id="toc"></div><div class="page-foot"><span>Pilih judul untuk menuju cerita</span><span>✦</span></div></div>`;add(toc);
pages.forEach((p,i)=>add(makePage(p.t,p.p,svgArt(p.m,i+1),i+1,(i%3===1?"layout-side":i%3===2?"layout-wide":""))));
add(makePage("Pesan Moral Cerita",`1. Keberanian bukan berarti tidak pernah takut, melainkan berani menghadapi ketakutan.\n2. Persahabatan membuat perjalanan yang sulit menjadi lebih ringan.\n3. Jangan membiarkan keegoisan merugikan orang lain.\n4. Setiap orang berhak mendapatkan kesempatan untuk memperbaiki kesalahan.\n5. Kekuatan terbesar berasal dari kepedulian, kejujuran, dan ketulusan.\n6. Harapan selalu ada bagi mereka yang tidak menyerah.`,`<svg viewBox="0 0 900 430"><rect width="900" height="430" fill="#24483e"/><circle cx="450" cy="160" r="120" fill="#e7ca78" opacity=".4"/><path d="M450 430 V180" stroke="#9e8050" stroke-width="35"/><circle cx="450" cy="130" r="120" fill="#4a885b"/></svg>`,""));
add(makePage("Sampai Jumpa di Petualangan Berikutnya",`Setiap perjalanan meninggalkan jejak. Semoga kisah Elvan, Nara, Luma, Garon, dan Arel menjadi pengingat bahwa dunia akan lebih terang ketika kita memilih untuk peduli.\n\nTerima kasih telah membaca.`,coverSvg(),""));
let back=document.createElement("section");back.className="page cover-back";back.innerHTML=`<div class="page-inner"><h2>Rahasia di Balik Hutan Cahaya</h2><p>Ketika cahaya misterius mulai menghilang dari sebuah hutan ajaib, Elvan dan Nara memulai perjalanan yang akan mengubah hidup mereka. Bersama seekor burung emas dan seorang penjaga misterius, mereka harus menemukan rahasia Kristal Kehidupan. Namun, perjalanan tersebut mengajarkan bahwa kekuatan terbesar bukan berasal dari sihir, melainkan dari keberanian, persahabatan, dan ketulusan hati.</p><p style="color:#d9bd72;font-size:12px;letter-spacing:.2em;margin-top:45px">✦ AKHIR CERITA ✦</p></div>`;add(back);
all.forEach((page,i)=>page.style.zIndex=String(all.length-i));
const tocEl=document.getElementById("toc");pages.forEach((p,i)=>{let b=document.createElement("button");b.textContent=`${String(i+1).padStart(2,"0")} · ${p.t}`;b.onclick=()=>go(i+4);tocEl.appendChild(b)});
function go(n){current=Math.max(0,Math.min(all.length-1,n));all.forEach((p,i)=>p.classList.toggle("flipped",i<current));document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===all.length-1;let storyNo=current-3;document.getElementById("counter").textContent=current===0?"Sampul":storyNo>=1&&storyNo<=34?`Cerita ${storyNo} dari 34`:current===all.length-1?"Sampul belakang":`Bagian awal / penutup`;let pct=Math.round(current/(all.length-1)*100);document.getElementById("progress").style.width=pct+"%";document.getElementById("percent").textContent=pct+"% selesai";localStorage.setItem("hutanCahayaPage",current)}
document.getElementById("prev").onclick=()=>go(current-1);document.getElementById("next").onclick=()=>go(current+1);
document.getElementById("contentsBtn").onclick=()=>go(3);
document.getElementById("bookmarkBtn").onclick=()=>{localStorage.setItem("hutanCahayaBookmark",current);toast("Bookmark disimpan pada halaman ini.")};
document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("night");let on=document.body.classList.contains("night");document.querySelectorAll(".page:not(.cover):not(.cover-back)").forEach(p=>p.style.background=on?"#e9e4d7":"var(--paper)");document.getElementById("themeBtn").textContent=on?"☀ Mode siang":"☾ Mode malam"};
let scale=1;document.getElementById("zoomIn").onclick=()=>{scale=Math.min(1.3,scale+.1);document.documentElement.style.setProperty("--scale",scale)};document.getElementById("zoomOut").onclick=()=>{scale=Math.max(.8,scale-.1);document.documentElement.style.setProperty("--scale",scale)};
document.getElementById("fullBtn").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700)}
let startX=0;book.addEventListener("touchstart",e=>startX=e.changedTouches[0].clientX,{passive:true});book.addEventListener("touchend",e=>{let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)go(current+(d<0?1:-1))},{passive:true});
book.addEventListener("click",e=>{if(e.target.closest("button"))return;let r=book.getBoundingClientRect();go(current+(e.clientX>r.left+r.width/2?1:-1))});
document.addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(current-1)}});
let saved=Number(localStorage.getItem("hutanCahayaPage")||0);go(saved);
</script></body></html>
